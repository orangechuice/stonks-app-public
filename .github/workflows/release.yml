# Builds and publishes the macOS and Android artifacts for a tagged release.
#
# Optional repository secrets. When they are absent the workflow still succeeds:
# the Android release APK falls back to the debug signing key, exactly as a local
# build does. Set all four together or none of them.
#
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks   (base64 -i release.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       password for that key
#
# WARNING: the keystore is the app's identity on Android. If it is lost, existing
# users can no longer upgrade in place — they have to uninstall and reinstall,
# losing local data. Keep a backup outside both this repo and the upstream one.

name: Publish Desktop & Mobile Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    # Same reason as deploy.yml: this file is exported to the public mirror, so
    # it also exists upstream. Public binaries are published from the mirror, so
    # a tag pushed to the private repo must not build a second, private release.
    if: github.repository == 'orangechuice/stonks-app-public'

    runs-on: macos-latest

    # Lifted to job level because the `secrets` context is not available in a
    # step-level `if:` — only `env` is.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      # Written outside the workspace so it can never be picked up by a build
      # step or committed by accident.
      - name: Decode Android signing key
        id: signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build Web, Desktop, and Android Apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty when no keystore secret is set, which makes build.gradle fall
          # back to the debug signing config.
          STONKS_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          STONKS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STONKS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STONKS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Order matters. `npm run android:build` calls `npm run build`, whose
        # `clean` step deletes dist_electron/ — so it has to run BEFORE
        # electron-builder, or it wipes the .dmg, .zip and latest-mac.yml that
        # electron-builder just produced and the release ships as APK-only.
        run: |
          npm run android:build
          npx electron-builder --mac --publish never
          cp Stonks.apk dist_electron/

      - name: Upload Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          # Fail loudly if an artifact is missing. Without this the release
          # publishes whatever happens to be there, which is how a build-order
          # mistake ships a release with no macOS build and no updater manifest.
          fail_on_unmatched_files: true
          files: |
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/latest-mac.yml
            dist_electron/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
